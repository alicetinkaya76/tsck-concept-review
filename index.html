<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; frame-src 'self' blob:; connect-src 'self'; media-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f6f4ed">
  <title>TSCK · Private concept review</title>
  <link rel="stylesheet" href="gate.css?v=20261102-minimal">
  <script src="gate.js" defer></script>
</head>
<body>
  <main id="entrance">
    <section class="access" aria-label="Password access">
      <form id="unlock-form">
        <label for="password">Password</label>
        <div class="password-row"><input id="password" name="presentation-password" type="password" required autocomplete="current-password" spellcheck="false" aria-describedby="access-status"><button type="button" id="show-password" aria-pressed="false">Show</button></div>
        <button type="submit" class="unlock" id="unlock">Open <span aria-hidden="true">↗</span></button>
        <p id="access-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <div id="review-shell" hidden><div class="review-bar"><span>TSCK <span class="bar-divider">/</span> PRIVATE REVIEW</span><button type="button" id="lock">Lock presentation <span aria-hidden="true">↗</span></button></div><div id="frame-host"></div></div>
</body>
</html>
